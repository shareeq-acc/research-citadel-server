name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository_owner }}/research-citadel-server

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
      # --ignore-scripts, then generate explicitly: postinstall runs
      # `prisma generate`, which needs the schema, and the ordering is easier
      # to reason about when it is a step of its own.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm prisma generate
        env:
          # Generation reads the schema, never the database, so a placeholder
          # is enough — and means CI needs no live Postgres to type-check.
          DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy?schema=public
      - run: pnpm lint
      - run: pnpm test

  build:
    name: Build and publish
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:main
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
